# Baut bei jedem Push die App und stellt die APK als Release bereit:
# github.com/gansklebrig/Audiophil/releases/latest → Equalizer.apk
# Die App selbst sucht ihre Updates ebenfalls dort (Updater.kt).
name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Versionsnummer: Lauf-Nummer + 10 (das alte Repo kam bis 1.3; so ist jede neue Version höher)
      - name: Version festlegen
        run: echo "EQ_VERSION=$(( GITHUB_RUN_NUMBER + 10 ))" >> "$GITHUB_ENV"

      - name: Signaturschlüssel entschlüsseln
        env:
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          if [ -z "$KEYSTORE_PASSPHRASE" ]; then
            echo "::error::Secret KEYSTORE_PASSPHRASE fehlt (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in keystore/equalizer.jks.enc -out keystore/equalizer.jks -pass env:KEYSTORE_PASSPHRASE

      - name: APK bauen
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Equalizer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Equalizer
          path: Equalizer.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ env.EQ_VERSION }}
          name: Equalizer 1.${{ env.EQ_VERSION }}
          body: |
            ${{ github.event.head_commit.message }}

            Installieren: unten auf **Equalizer.apk** tippen, herunterladen und öffnen.
          files: Equalizer.apk
          make_latest: true
