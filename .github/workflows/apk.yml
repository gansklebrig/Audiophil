# Baut bei jedem Push die App und stellt die APK als Release bereit:
# github.com/gansklebrig/Equalizer/releases/latest → Equalizer.apk
name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK bauen
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Equalizer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Equalizer
          path: Equalizer.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Equalizer 1.${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}

            Installieren: unten auf **Equalizer.apk** tippen, herunterladen und öffnen.
          files: Equalizer.apk
          make_latest: true
